name: docker

# Pushes to branches and pull requests only build the image. A release tag
# graphene-X.Y.Z builds and publishes it as X.Y.Z and latest to the GitHub
# Container Registry and, when the repository variable DOCKERHUB_REPO and the
# secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are set, to Docker Hub. The debug
# symbols of the binaries are attached to the GitHub release of the tag (a draft
# release is created if there is none yet), and to every run as an artifact.
#
# A pre-release tag graphene-X.Y.Z-rcN is published as X.Y.Z-rcN only, without
# latest, and its draft release is marked as a pre-release.
on:
  push:
    branches: ['**']
    tags: ['graphene-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write   # upload of the debug symbols to the release
      packages: write   # push to ghcr.io
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/graphene-') }}
      PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/graphene-') && contains(github.ref_name, '-rc') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4
        id: buildx

      # The compiler cache lives in a BuildKit cache mount, which the layer cache
      # does not carry between runs. Every commit changes the build context
      # (.git is part of it), so without this every run compiles from scratch.
      - uses: actions/cache@v6
        id: ccache
        with:
          path: ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            { "ccache": "/root/.cache/ccache" }
          skip-extraction: ${{ steps.ccache.outputs.cache-hit }}

      - name: Image names
        id: names
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ -n "${{ vars.DOCKERHUB_REPO }}" ]]; then
            echo "dockerhub=${{ vars.DOCKERHUB_REPO }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ steps.names.outputs.ghcr }}
            ${{ steps.names.outputs.dockerhub }}
          # latest=auto would tag every release tag as latest, pre-releases
          # included; latest comes only from the raw rule below.
          flavor: |
            latest=false
          tags: |
            type=match,pattern=graphene-(\d+\.\d+\.\d+(-rc\d+)?)$,group=1
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' && env.PRERELEASE != 'true' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,enable=${{ env.PUBLISH != 'true' }}

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true' && steps.names.outputs.dockerhub != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm "$image" --version
          docker run --rm "$image" cli_wallet --version

      # Debug symbols for decoding stack traces of the stripped binaries. The
      # builder stage comes from the cache of the step above.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: debug-symbols
          outputs: type=local,dest=debug-symbols
          cache-from: type=gha

      - uses: actions/upload-artifact@v7
        with:
          name: debug-symbols-${{ github.sha }}
          path: debug-symbols/
          retention-days: 90

      - name: Attach debug symbols to the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="graphene-core-${TAG#graphene-}-debug-symbols-linux-x86_64.tar.xz"
          tar -C debug-symbols -cJf "$archive" .
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=()
            [[ "$PRERELEASE" == true ]] && prerelease=(--prerelease)
            gh release create "$TAG" --draft "${prerelease[@]}" --verify-tag --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" "$archive" --clobber
